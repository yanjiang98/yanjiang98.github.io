<div class="masthead">
  <div class="masthead__inner-wrap" style="display:flex;align-items:center;">
    <div class="masthead__menu" style="flex:1;min-width:0;">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <div style="flex-shrink:0;padding-left:12px;">
      <button id="lang-toggle" onclick="toggleLang()" style="background:transparent;color:#7a8288;border:1.5px solid #bbb;border-radius:4px;padding:3px 10px;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap;">中文</button>
    </div>
  </div>
</div>
